[package]
name = "MyNKF"
version = "1.5.4"
edition = "2024"

[lib]
name = "mynkf"
path = "src/lib.rs"

[[bin]]
name = "mynkf"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mynkf-gui"
path = "src/bin/mynkf-gui.rs"
required-features = ["gui"]

[features]
default = ["cli", "gui"]
cli = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
# 共有ライブラリの参照追加
common_lib = { path = "../common_lib" }

# GUI依存 (オプショナル)
eframe = { version = "0.35", optional = true }
egui = { version = "0.35", optional = true }
rfd = { version = "0.17", optional = true }

# Target-specific dependencies removed to use direct Win32 FFI for lower footprint

[profile.release]
opt-level = 'z'       # Optimize for binary size
lto = true            # Link-Time Optimization
codegen-units = 1     # Integrate code generation units
panic = 'abort'       # Abort on panic to save space
strip = true          # Strip symbols and debug info

