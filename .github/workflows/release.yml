name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MyNKF

    steps:
      # MyNKFは親ディレクトリの ../common_lib に相対パスで依存しているため、
      # ワークスペース内に MyNKF と common_lib を並行してチェックアウトします。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: MyNKF

      # 依存ライブラリである common_lib をクローンします。
      # secrets.PAT が設定されていない場合は、デフォルトの github.token にフォールバックします。
      - name: Checkout common_lib
        uses: actions/checkout@v4
        with:
          repository: tkshnkgwr/common_lib
          path: common_lib
          token: ${{ secrets.PAT || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 1. CLI版のビルド
      - name: Build CLI release
        run: cargo build --release --verbose

      # 2. バイナリを含む zip アーカイブの作成
      - name: Archive production binaries
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/mynkf.exe -DestinationPath target/release/MyNKF-windows-x64.zip -Force

      # 3. GitHub Release の作成とアップロード
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: MyNKF/target/release/MyNKF-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
